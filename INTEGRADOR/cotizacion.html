<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Apolo 3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="encapezado">
        <div class="encabezado_interno">
            <a class="logo" href="index.html">Apolo3D</a>
            <nav aria-label="Menu de navegación">
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="cotizacion.html">Solicitar Cotización</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="portada">
            <h1>Contacto</h1>
      <p>Contanos que diseño queres o pasanos tu diseño y lo imprimimos</p>
        </section>  
      <form id="formulario-contacto" class="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" aria-describedby="error-nombre">
          <p id="error-nombre" class="campo__error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email" placeholder="correo@gmail.com" aria-describedby="error-correo">
          <p id="error-correo" class="campo__error" role="alert"></p>
        </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" autocomplete="tel" placeholder="Ej: 2657 123456"
          aria-describedby="error-telefono">
        <p id="error-telefono" class="campo__error" role="alert"></p>
      </div>

      <div class="campo">
        <label for="archivo">Archivo</label>
        <input id="archivo" name="archivo" type="file"
          aria-describedby="error-archivo">
        <button id="eliminar-archivo" class="button" type="button" hidden>Quitar archivo</button>
        <p id="error-archivo" class="campo__error" role="alert"></p>
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Contanos tu diseño"
          aria-describedby="error-mensaje"></textarea>
        <p id="error-mensaje" class="campo__error" role="alert"></p>
      </div>

        <button class="boton" type="submit">Enviar consulta</button>
      </form>

    <aside id="resumen-envio" class="resumen" aria-live="polite" hidden></aside>

    </main>
    <script src="cotizacion.js"></script>
</body>

</html>
