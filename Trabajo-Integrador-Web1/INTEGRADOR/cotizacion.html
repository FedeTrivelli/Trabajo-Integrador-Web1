<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Apolo 3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
              <a href="index.html"><img src="Imagenes/logo-apolo.png" alt="Apolo 3D, ir al inicio"></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Producto</a></li>
                <li><a href="cotizacion.html">Solicitar cotización</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="portada">
            <h1>Contacto</h1>
      <p>Contanos que diseño queres o pasanos tu diseño y lo imprimimos</p>
        </section>    
    </section class="formulario-section">
      <form id="formulario-contacto" class="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" aria-describedby="error-nombre" placeholder="Nombre Completo">
          <p id="error-nombre" class="campo__error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email" aria-describedby="error-correo" placeholder="Correo">
          <p id="error-correo" class="campo__error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" autocomplete="tel" placeholder="Ej: 2657 123456" aria-describedby="error-telefono">
          <p id="error-telefono" class="campo__error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" aria-describedby="error-mensaje"></textarea>
          <p id="error-mensaje" class="campo__error" role="alert"></p>
        </div>

        <button class="button" type="submit">Enviar consulta</button>
      </form>

      <aside id="resumen-envio" class="resumen" aria-live="polite" hidden></aside>
                
        </section>

    </main>
    <footer class="pie">
        <div class="pie-interno">
        <address style="font-style:normal">
            <p>Tel. (42) 332-8700</p>
            <p>info@apolo3d.com</p>
        </address>
        <p>© APOLO 3D 2026</p>
        </div>
    </footer>
    <script src="cotizacion.js"></script>
</body>

</html>
